[project]
name = "blender-buddy"
version = "0.1.0"
description = "TUI to expedite building Godot-ready game models in Blender."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2",
]

[project.scripts]
blender-buddy = "blender_buddy.app:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at the repository root (blender_buddy/),
# not under a src/ directory.
module-root = ""

[dependency-groups]
dev = [
    "textual-dev>=1.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
