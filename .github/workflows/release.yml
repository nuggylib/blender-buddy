name: Release (rolling latest)

# Rolls the single `latest` prerelease on every successful push-to-main Build.
# It is triggered by `workflow_run` (not `needs:`) so it stays decoupled from the
# secret-free, fork-facing build.yml: a cancelled or failed Build never releases,
# and no signing secret is ever exposed to PR/fork code.
#
# Phase 3a scope: AD-HOC signing only. The macOS binary inside the release-<target>
# archive was already ad-hoc signed and packaged by build.yml, so this workflow
# needs no macOS runner — a single Ubuntu `publish` job downloads those exact
# archives, checksums them, and publishes. Developer ID signing + notarization
# arrive in Phase 3b as a `sign-macos` job inserted ahead of `publish`.

on:
  workflow_run:
    # Matches build.yml's `name: Build`. Runs after every Build completion; the
    # job `if:` below narrows to the one case that should publish.
    workflows: ["Build"]
    types: [completed]

# Serialize releases so two quick merges publish in order (last-writer-wins by
# merge order) instead of interleaving into a tag-points-at-older-commit state.
# Never cancel: a half-published `latest` must finish, not get killed mid-roll.
concurrency:
  group: release-latest
  cancel-in-progress: false

# Floor: no permissions. The publish job opts into exactly what it needs.
permissions: {}

jobs:
  publish:
    # Publish only when a Build that ran on a push to THIS repo's main succeeded.
    # workflow_run always runs release.yml from the default branch, so these
    # fields describe the *triggering* Build, not this workflow.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'nuggylib/blender-buddy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create/refresh the `latest` release + force-move its tag
      actions: read # download-artifact reads artifacts from the triggering Build run
    steps:
      # Check out the exact commit the Build ran on so `body_path` and the moved
      # tag both point at the merged code, not release.yml's default-branch tip.
      - name: Checkout merged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # workflow_run artifacts do NOT auto-transfer — pull them from the
      # triggering run by id. build.yml uploads one `release-<target>` archive
      # per leg on push; merge-multiple flattens all three into ./dist.
      - name: Download release binaries from the Build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Relative names so a user who downloads into one dir can verify directly.
          shasum -a 256 blender-buddy-* > SHA256SUMS
          cat SHA256SUMS

      # softprops/action-gh-release updates a release in place but never MOVES an
      # existing tag, so a rolling `latest` would stay pinned to the first commit.
      # Force-move the tag ourselves first; the publish step then finds it already
      # pointing at the merged commit.
      - name: Move `latest` tag to the merged commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git tag -f latest "$HEAD_SHA"
          git push -f origin refs/tags/latest

      # In-place roll: clobbers same-named assets, handles the already-exists race,
      # gentler on the CDN than delete+recreate. --prerelease keeps the real
      # "Latest" badge free for a future tagged vX.Y.Z. make_latest:false is belt
      # and suspenders for that. Immutable Releases MUST stay disabled on this repo
      # while `latest` is a moving tag.
      - name: Publish / refresh the `latest` prerelease
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: latest
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Latest (rolling build)
          body_path: .github/release-notes-latest.md
          prerelease: true
          make_latest: "false"
          files: |
            dist/blender-buddy-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
